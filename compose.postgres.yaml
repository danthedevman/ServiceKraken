# Docker Compose >= 2.24.4: docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
# Set DATABASE_PROVIDER=postgres and DATABASE_URL in .env before starting.
services:
  mongo:
    profiles: [mongodb]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicetrident}
      POSTGRES_USER: ${POSTGRES_USER:-servicetrident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    depends_on: !override
      postgres: { condition: service_healthy }
  workers:
    depends_on: !override
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  scheduler:
    depends_on: !override
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
