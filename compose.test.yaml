services:
  test:
    build:
      context: .
      dockerfile: test/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://127.0.0.1:8090
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicekraken_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
    networks: [backend]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d servicekraken_test]
      interval: 2s
      timeout: 5s
      retries: 30
